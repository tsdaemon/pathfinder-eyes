teleop_twist_joy_node:
  ros__parameters:
    # Layout of the 8BitDo Ultimate 2 Wireless via joy_node (8 axes, 24 buttons), mapped
    # with tools/joy_probe.py; deck/drive.py (Steam Deck, via udp_joy.py) sends the same
    # layout. Axis 0/1 = left stick X/Y, axis 2 = right stick X, all reading positive for
    # left/up - matching the vx/vy/wz conventions in vel_to_serial.py.
    # LB/RB = buttons 6/7. Triggers are axes 5 (LT) / 4 (RT), 1.0 released, unused.
    axis_linear:
      x: 1   # left stick vertical
      y: 0   # left stick horizontal
    axis_angular:
      yaw: 2 # right stick horizontal
    # Magnitude matches vel_to_serial's max_linear_speed/max_angular_speed defaults (0.5 m/s,
    # 1.5 rad/s - see docs/motor-control.md), so full stick deflection reaches its full
    # [-1, 1] range. wz in particular needs to reach close to full deflection to actually turn
    # the chassis - see the "what's not wired up yet" note in docs/motor-control.md.
    scale_linear:
      x: 0.5
      y: 0.5
    scale_angular:
      yaw: 1.5
    # Hold LB to drive, RB for turbo.
    enable_button: 6
    enable_turbo_button: 7
