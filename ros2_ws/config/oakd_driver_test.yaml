/**:
  ros__parameters:
    camera:
      i_pipeline_type: Depth
      i_enable_imu: true
    # Match launch_depthai_inertial.py's stereo_inertial_node settings as closely as this
    # driver allows, for a fair comparison: mono only (no RGB - stereo_inertial_node never
    # touches it, and depth_aligned=false there means depth isn't referenced to RGB either),
    # 400p mono resolution.
    rgb:
      i_disable_node: true
    left:
      i_resolution: "400P"
    right:
      i_resolution: "400P"
    stereo:
      i_publish_topic: true
      i_align_depth: false
      i_right_rect_publish_topic: true
    imu:
      # Lowest-latency settings, to test against the ~100ms IMU-behind-camera-frames lag
      # seen with depthai_examples' stereo_inertial_node (hardcoded batch_report_threshold=5,
      # max_batch_reports=20, LINEAR_INTERPOLATE_GYRO) - see docs/notes/2026.08.07.md.
      # depthai_ros_driver exposes these as ROS params instead of hardcoding them.
      i_batch_report_threshold: 1
      i_max_batch_reports: 4
      i_sync_method: COPY
