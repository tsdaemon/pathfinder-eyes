[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=0.0.0.0:9001

[unix_http_server]
file = tmp/supervisor.sock

[supervisord]
logfile=log/supervisord.log
pidfile=tmp/supervisord.pid
childlogdir=log/

[supervisorctl]
serverurl = unix://tmp/supervisor.sock

[program:robot_state_publisher]
command=ros2 run robot_state_publisher robot_state_publisher robot.urdf
killasgroup=true
stopasgroup=true

[program:depthai]
command=python launch_depthai_inertial.py
killasgroup=true
stopasgroup=true

[program:rtabmap]
command=python launch_rmaptab_inertial.py
killasgroup=true
stopasgroup=true

[program:foxglove_bridge]
command=ros2 run foxglove_bridge foxglove_bridge --port 8765
killasgroup=true
stopasgroup=true

[program:supervisord_bridge]
command=python launch_supervisord_bridge.py
killasgroup=true
stopasgroup=true

[program:diagnostics]
command=ros2 launch launch_diagnostics.py
killasgroup=true
stopasgroup=true
