[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=0.0.0.0:9001

[unix_http_server]
file = tmp/supervisor.sock

[supervisord]
logfile=log/supervisord.log
pidfile=tmp/supervisord.pid
childlogdir=log/
killasgroup=true

[supervisorctl]
serverurl = unix://tmp/supervisor.sock

[program:robot_state_publisher]
command=ros2 run robot_state_publisher robot_state_publisher robot.urdf

[program:depthai]
command=python launch_depthai.py

[program:foxglove_bridge]
command=ros2 run foxglove_bridge foxglove_bridge --port 8765

[program:supervisor_bridge]
command=python launch_supervisor_bridge.py
